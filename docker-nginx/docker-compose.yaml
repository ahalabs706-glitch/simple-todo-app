services:
  nginx:
    image: nginx:alpine
    container_name: nginx-lab
    ports:
      - "80:80"
    networks:
      - aha-network
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - nginx_config:/etc/nginx/conf.d
    restart: unless-stopped

networks:
  aha-network:
    external: true

volumes:
  nginx_config:
    driver: local