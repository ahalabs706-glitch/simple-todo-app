services:
  postgres:
    image: postgres:17
    container_name: postgres-lab
    environment:
      POSTGRES_DB: aha-app
      POSTGRES_USER: aha-app
      POSTGRES_PASSWORD: ahapassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: