services:
  postgres:
    image: postgres:17
    container_name: postgres-lab
    environment:
      POSTGRES_DB: aha-app
      POSTGRES_USER: aha-app
      POSTGRES_PASSWORD: ahapassword
    ports:
      - "5432:5432"
    networks:
      - aha-network
    volumes:
      - aha_data:/var/lib/postgresql/data
volumes:
  aha_data:
networks:
  aha-network:
    external: true  